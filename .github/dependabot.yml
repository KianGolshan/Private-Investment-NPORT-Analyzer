# Dependency updates (P9): weekly, grouped, as PRs that CI checks before any
# merge; nothing deploys until a PR is merged to main. Major versions of npm
# packages (Express, Preact, TypeScript...) are upgraded on purpose, with a
# review, not proposed here: merging main deploys the live site.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dev:
        dependency-type: development
      prod:
        dependency-type: production
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      web:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
