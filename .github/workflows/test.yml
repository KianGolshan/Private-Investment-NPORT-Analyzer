name: Test

# Every branch: v2 work lives on feature branches, and CI must run on them
# before anything reaches main.
on:
  push:
  pull_request:

# A push to a branch with an open PR triggers both events; one run per branch
# and commit is enough, so the second cancels the first.
# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # better-sqlite3 declares engines.node >=22 (and segfaults on 20.x
        # rather than erroring cleanly) — see the "engines" field in
        # package.json.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # P9: the deploy scripts (deploy/), checked with shellcheck (preinstalled on
  # the runner) and bash -n.
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --version && shellcheck -x deploy/*.sh deploy/bin/* deploy/test/*.sh deploy/test/fake-systemctl
      - run: for f in deploy/*.sh deploy/bin/* deploy/test/*.sh; do bash -n "$f"; done

  # P9: the deploy drill: real deploys, an automatic rollback and a manual one,
  # in a temporary tree with real server processes (deploy/test/drill.sh).
  deploy-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: bash deploy/test/drill.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Deployed dependencies, root and web (staff full-stack review R10): a high or
      # critical advisory fails the build until the lockfile is updated and reviewed.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      # Development and build tools too (Codex verification V09): clean since nodemon gave way to node --watch.
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: web

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  # The browser suite (P6c R3): the built app on the real server over the
  # golden warehouse, in Chromium (web/e2e, web/playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
